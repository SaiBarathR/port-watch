name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request supersedes the run in progress; pushes to main
# each get a full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 matches the release baseline (see release.yml)
        os: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Shared with release.yml. Only main writes it; pull requests read it.
          shared-key: tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Formatting and frontend lint do not depend on the platform, so one leg
      # is enough (and Windows checkouts carry CRLF line endings).
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          npm run format:check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint frontend
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm test

      # Every leg: most of the backend is behind #[cfg(target_os)].
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app (compile check, no installers)
        run: npm run tauri -- build --no-bundle

      # The release build is a GUI-subsystem program, so a shell neither waits
      # for it nor sees its exit code. `install-cli` writes a .cmd shim that
      # fixes both; this is the only place that can be checked for real.
      - name: Smoke-test the installed CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "src-tauri\target\release\port-watch.exe"
          $install = Start-Process -FilePath $app -ArgumentList "install-cli" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "install-cli exited with $($install.ExitCode)" }
          $shim = Join-Path $env:LOCALAPPDATA "Programs\Port Watch\port-watch.cmd"
          Get-Content $shim

          & $shim check 1
          if ($LASTEXITCODE -ne 0) { throw "expected exit code 0 for a free port, got $LASTEXITCODE" }

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $output = & $shim check $port
          $code = $LASTEXITCODE
          # And with its output redirected to a file.
          Start-Process -FilePath $shim -ArgumentList "check", "$port" -RedirectStandardOutput owners.json -NoNewWindow -Wait
          $redirected = Get-Content owners.json -Raw
          $listener.Stop()
          if ($code -ne 1) { throw "expected exit code 1 for port $port in use, got $code" }
          # Captured by a script, as CI jobs that parse the JSON do.
          if ("$output" -notmatch "`"port`":$port\b") { throw "port $port missing from the captured output: $output" }
          if ("$redirected" -notmatch "`"port`":$port\b") { throw "port $port missing from the redirected output: $redirected" }

          # The listener is this step's own shell, started moments ago.
          $startedAt = [long]@("$output" | ConvertFrom-Json)[0].started_at
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          if ($startedAt -le 0 -or $startedAt -gt $now + 5 -or $now - $startedAt -gt 86400) {
            throw "implausible started_at $startedAt (now $now): $output"
          }

          # UDP rides in the same PowerShell scan, and only when asked for.
          $udp = New-Object System.Net.Sockets.UdpClient 0
          $udpPort = $udp.Client.LocalEndPoint.Port
          & $shim check $udpPort --udp | Out-Null
          $withUdp = $LASTEXITCODE
          & $shim check $udpPort | Out-Null
          $withoutUdp = $LASTEXITCODE
          $udp.Close()
          if ($withUdp -ne 1) { throw "expected exit code 1 for UDP port $udpPort with --udp, got $withUdp" }
          if ($withoutUdp -ne 0) { throw "expected exit code 0 for UDP port $udpPort without --udp, got $withoutUdp" }
          exit 0

      # The built app in its real webview: a listener is started, found in the
      # table and stopped from its row's menu. Linux only: macOS has no
      # WebDriver for WKWebView, and see below for Windows. The component
      # tests stand in for this on both.
      - name: Install the WebDriver tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked

      - name: End-to-end smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          E2E_SCREENSHOTS: e2e-screenshots
        run: xvfb-run -a node e2e/smoke.mjs src-tauri/target/release/port-watch

      # The same test cannot run on Windows for now. Edge's WebDriver asks a
      # WebView2 app for a debugging port through an environment variable,
      # and WebView2 runtimes from 152 on ignore it when the app passes
      # browser arguments of its own, as every Tauri app does
      # (actions/runner-images#14738). Until that changes, at least see the
      # window's process start, stay up and get its webview: nothing else
      # runs this platform's launch code.
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath src-tauri\target\release\port-watch.exe -PassThru
          Start-Sleep 15
          if ($app.HasExited) { throw "the app exited with code $($app.ExitCode) within 15 s of starting" }
          $webview = Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" |
            Where-Object { $_.CommandLine -like '*--webview-exe-name=port-watch.exe*' }
          Stop-Process -Id $app.Id -Force
          if (-not $webview) { throw "the app stayed up but never started its webview" }
          "the app stayed up and started its webview"

      - name: Keep the window's pictures if the smoke test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  # What the tests reach, for reading: the tables go to the run's summary
  # page. No number is enforced, and a failure here does not fail the run.
  coverage:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # An instrumented build shares nothing with the ordinary one.
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend coverage
        shell: bash
        run: |
          NO_COLOR=1 npm run test:coverage | tee frontend-coverage.txt
          {
            echo "## Frontend coverage"
            echo '```'
            sed -n '/^-.*|/,$p' frontend-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Tauri crate will not compile without the built frontend.
      - name: Build frontend
        run: npm run build

      # Only the code for this platform: the rest is not compiled here.
      - name: Rust coverage
        shell: bash
        working-directory: src-tauri
        run: |
          cargo llvm-cov --summary-only | tee ../rust-coverage.txt
          {
            echo "## Rust coverage (macOS code)"
            echo '```'
            sed -n '/^Filename/,$p' ../rust-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
