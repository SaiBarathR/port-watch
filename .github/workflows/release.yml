name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary so one DMG serves both Apple Silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported LTS so the glibc/webkit baseline stays compatible
          # with older distros (AppImage/deb built on newer Ubuntu won't run there).
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - os: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Reads the cache CI writes on main; a tag's own cache is unreachable
          # from any later run, so it is not saved.
          shared-key: tauri
          save-if: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # A tag can point at a commit CI never ran on; do not ship it untested.
      - name: Run frontend unit tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: |
          npm run build
          cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "Port Watch v__VERSION__"
          releaseBody: "Downloads for macOS, Windows and Linux are under Assets below."
          # What changed, from the pull requests merged since the last
          # release; added after the line above.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
